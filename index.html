<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Sharing</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <!-- Header -->
        <header>
          <div class="title">
            <h1 id="title">SKILL SHARING</h1>
          </div>
        </header>

        <main>
          <div class="userInput">
            <!-- User Input -->
            <form action="" id="inputForm">
              <div class="nameSection">
                <label for="name" id="name">Your name:</label>
                <input
                  type="text"
                  id="userName"
                  placeholder="Enter your name..."
                />
              </div>
            </form>
          </div>

          <!-- Topic and COMMENT-->

          <div class="topicContainer">
             <button id="deleteBtn">Delete Talk</button>
            <section id="topics_comments">
              <div class="topic">
                <h2 id="userTopic">JavaScript</h2>
               
              </div>

              <p id="author">by <strong>Precious</strong></p>

              <p class="topicText">
                JavaScript is a programming language used to communicate with the browser and add interactive
                action to website.
              </p>
            </section>
          </div>

            <section id="comment">
            <!-- COMMENTS -->
            <div class="comment">

              <h3 id="commentText">Comments (1)</h3>

              <ul id="userCommentList">
                <li>Thanks for sharing this.</li>
              </ul>

              <!-- COMMENT INPUT -->
              <div class="enterComment">
                <form action="" id="commentForm">
                  <input
                    type="text"
                    id="commentInput"
                    placeholder="Write a comment..."
                  />
                  <button type="submit" id="commentBtn">Add Comment</button>
                  
                </form>

              </div>
            </div>
        </section>

          <!-- SUMBIT TALK SECTION -->
          <section id="submitTalk">
            <h2 id="submitaTalk">Submit a Talk</h2>
            <!-- TALK -->

            <form action="" id="talk_summaryForm">
              <div class="talk">
                <h4 class="title_summary">Title:</h4>

                <input
                  type="text"
                  id="titleInput"
                  placeholder="Enter your talk..."
                />
              </div>

              <div class="summary">
                <h4 class="title_summary">Summary:</h4>
                <textarea
                  name="summary"
                  id="summaryText"
                  placeholder="Enter a summary of your talk..."
                ></textarea>
                <button type="submit" id="submitTalkBtn">Submit talk</button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
